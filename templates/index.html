<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliFix — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4f0;
      --panel: #ffffff;
      --panel2: #f0ede6;
      --ink: #1c1917;
      --mute: #6b665e;
      --line: #e2ddd4;
      --accent: #1b4332;
      --accent-soft: #e6f0ec;
      --parser: #6d28d9;
      --static: #b45309;
      --runtime: #b91c1c;
      --compiler: #0369a1;
      --sec: #991b1b;
      --ok: #15803d;
      --warn: #d97706;
      --head: 'Instrument Sans', system-ui, sans-serif;
      --body: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font: 13.5px/1.5 var(--body);
      overflow: hidden;
    }

    /* ---------- Minimal Top Nav ---------- */
    #appHeader {
      height: 46px;
      flex: none;
      background: #14281f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 25;
    }
    .brand { font: 700 15px/1 var(--head); letter-spacing: -0.01em; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      color: #d1fae5;
      text-decoration: none;
      font: 600 12.5px/1 var(--head);
      padding: 7px 12px;
      border-radius: 6px;
      transition: background .15s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .nav-link.active { background: #2d6a4f; color: #fff; }

    /* ---------- Workspace ---------- */
    #workspace {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 46%) minmax(0, 54%);
      min-height: 0;
    }

    button {
      font: 600 12.5px var(--head);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: filter .15s, background .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); }
    button.ghost:hover:not(:disabled) { background: var(--panel2); }
    button.amber { background: #b45309; color: #fff; }

    /* ---------- Left Column: Code Viewer ---------- */
    #left {
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--panel);
      min-width: 0;
      min-height: 0;
    }
    #topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #fcfbf9;
    }
    #topBarLeft { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #menuBtn {
      padding: 5px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #b7e4c7;
      flex: none;
    }
    #fname {
      font: 600 13px var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #codeBtns { display: flex; gap: 5px; align-items: center; flex: none; }
    #langSel {
      font: 600 12px var(--head);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
    }

    /* File Menu */
    #menu {
      position: absolute;
      top: 46px;
      left: 10px;
      z-index: 20;
      width: 320px;
      max-height: calc(100% - 60px);
      overflow: auto;
      padding: 12px;
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(28,25,23,.16);
    }
    #menu.open { display: block; }
    .menu-filter { display: flex; gap: 4px; margin: 8px 0 4px; }
    .menu-filter button { flex: 1; padding: 4px 6px; font-size: 11.5px; }
    #menu h4 {
      font: 700 10.5px var(--head);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--mute);
      margin: 10px 0 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--line);
    }
    .fi {
      padding: 5px 8px;
      border-radius: 5px;
      font: 12px var(--mono);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .fi:hover { background: var(--panel2); }
    .fi.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .tag {
      font: 700 9.5px/1 var(--head);
      padding: 2px 5px;
      border-radius: 3px;
      background: #e7e5e4;
      color: #44403c;
    }
    .tag.cpp { background: #e0f2fe; color: #0369a1; }
    .tag.sec { background: #fee2e2; color: #991b1b; }
    .tag.err { background: #dcfce7; color: #166534; }

    /* Code Lines */
    #code {
      flex: 1;
      overflow: auto;
      padding: 8px 0 24px;
      font: 12.5px/1.6 var(--mono);
    }
    .ln {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      padding: 1px 10px 1px 0;
      border-left: 3px solid transparent;
      align-items: center;
    }
    .ln:hover { background: #faf8f5; }
    .ln-num {
      color: #a8a29e;
      text-align: right;
      padding-right: 10px;
      user-select: none;
      font-size: 11px;
    }
    .ln-txt {
      white-space: pre;
      overflow-x: auto;
      padding: 1px 4px;
      border-radius: 3px;
      outline: none;
    }
    .ln-txt.editing-inline {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.18);
    }
    .ln-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 6px;
    }
    .ln-btn {
      opacity: 0;
      font: 700 11px/1 var(--mono);
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--panel2);
      color: var(--ink);
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .ln-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .ln:hover .ln-btn, .ln.editing .ln-btn { opacity: 1; }
    .ln.hit { cursor: pointer; }
    .ln.parser   { background: #f5f0ff; border-left-color: var(--parser); }
    .ln.static   { background: #fef7ec; border-left-color: var(--static); }
    .ln.runtime  { background: #fef1f1; border-left-color: var(--runtime); }
    .ln.compiler { background: #f0f9ff; border-left-color: var(--compiler); }
    .ln.sec      { background: #fde8e8; border-left-color: var(--sec); }
    .ln.patched-line { background: #ecfdf5; border-left-color: var(--ok); }
    .ln.active   { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
    .badge {
      font: 700 10px/1.2 var(--head);
      color: #fff;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .add-end-row {
      margin: 6px 12px 0 44px;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px dashed var(--line);
      color: var(--mute);
      font: 600 12px var(--head);
      cursor: pointer;
      display: inline-block;
    }
    .add-end-row:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    #leftFooter {
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      background: #fcfbf9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #legend { display: flex; gap: 9px; flex-wrap: wrap; font-size: 11px; color: var(--mute); }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    #scanBtn { padding: 7px 16px; font-size: 13px; }

    /* ---------- Right Column: Compact 3-Pillar Score + Clean Cards ---------- */
    #right {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }

    #scoreHeader {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
      min-width: 0;
    }
    .grade-box {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--mute);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-width: 0;
    }
    .grade-box .g-big { font: 800 16px/1.15 var(--head); }
    .grade-box .g-sub { font: 500 11px/1.2 var(--body); opacity: 0.9; margin-top: 2px; }

    .pillars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      min-width: 0;
    }
    .pillar {
      background: #faf9f6;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 9px;
      min-width: 0;
      overflow: hidden;
    }
    .pillar-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      font: 700 10.5px var(--head);
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .pillar-top b { font: 700 12.5px var(--mono); color: var(--ink); flex: none; }
    .pillar-bar { height: 4px; background: #e5e0d5; border-radius: 999px; overflow: hidden; margin: 5px 0 4px; }
    .pillar-bar > i { display: block; height: 100%; background: var(--ok); width: 0%; transition: width .3s ease; }
    .pillar-desc {
      font-size: 11px;
      color: var(--mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tabs */
    #tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: #fcfbf9;
      padding: 0 12px;
      min-width: 0;
    }
    .tab-group { display: flex; }
    .tab {
      background: transparent;
      color: var(--mute);
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 9px 12px;
      font-size: 12.5px;
    }
    .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    .tab .pip {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--runtime);
      margin-left: 5px;
      vertical-align: middle;
    }
    #projHint {
      font-size: 11.5px;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 8px;
    }

    .pane { display: none; flex: 1; min-height: 0; overflow: auto; padding: 14px; }
    .pane.on { display: block; }

    /* ---------- Security Gate Card ---------- */
    .sec-gate-card {
      background: #fff5f5;
      border: 1.5px solid #f87171;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .sec-gate-card h3 {
      font: 700 15px var(--head);
      color: #7f1d1d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .sec-gate-card p { font-size: 13px; color: #991b1b; margin-bottom: 10px; }
    .sec-finding-row {
      background: #fff;
      border: 1px solid #fecaca;
      border-left: 3px solid var(--sec);
      border-radius: 7px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .sec-finding-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; flex-wrap: wrap; }
    .sec-gate-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

    .sec-note-banner {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 3px solid #d97706;
      border-radius: 7px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #92400e;
    }

    /* ---------- Minimal Diagnostic Cards ---------- */
    .diag-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .diag-toolbar h2 { font: 700 14px var(--head); }

    .diag-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3.5px solid var(--c, var(--runtime));
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 11px;
    }
    .diag-card.active { box-shadow: 0 0 0 1.5px var(--ink); }
    .diag-card.is-patched { border-left-color: var(--ok); background: #f8fdf9; }
    .diag-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }
    .diag-head-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .line-jump-pill {
      font: 700 11.5px/1 var(--mono);
      padding: 4px 8px;
      border-radius: 5px;
      background: var(--panel2);
      color: var(--ink);
      border: 1px solid #d5cfc4;
    }
    .line-jump-pill:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .type-chip {
      font: 700 11px/1 var(--mono);
      padding: 4px 7px;
      border-radius: 4px;
      color: #fff;
      background: var(--c, var(--runtime));
    }
    .fix-pill {
      font: 700 10.5px/1 var(--head);
      padding: 3px 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
    }
    .fix-pill.ambig { background: #fef3c7; color: #92400e; }
    .fix-pill.applied { background: #15803d; color: #fff; }

    .trio-grid {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 4px 10px;
      font-size: 12.5px;
      margin-bottom: 10px;
    }
    .trio-grid dt {
      font: 700 10.5px/1.5 var(--head);
      text-transform: uppercase;
      color: var(--mute);
    }
    .trio-grid dd { color: var(--ink); }

    .patch-box {
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #fcfbf9;
    }
    .diff-line {
      font: 12px/1.5 var(--mono);
      padding: 5px 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .diff-line.minus { background: #fde8e8; color: #7f1d1d; }
    .diff-line.plus { background: #dcfce7; color: #14532d; border-top: 1px solid #bbf7d0; }

    .manual-patch-wrap {
      padding: 8px 10px;
      background: #f5f3ef;
      border-top: 1px solid var(--line);
    }
    .inline-code-editor-row { display: flex; gap: 6px; align-items: stretch; }
    .inline-code-gutter {
      background: #292524;
      color: #a8a29e;
      font: 11.5px/1.5 var(--mono);
      padding: 6px 8px;
      border-radius: 5px 0 0 5px;
      user-select: none;
      display: flex;
      align-items: center;
    }
    .inline-code-box {
      flex: 1;
      background: #1c1917;
      color: #f5f5f4;
      font: 12px/1.55 var(--mono);
      padding: 6px 10px;
      border-radius: 0 5px 5px 0;
      border: 1px solid #44403c;
      outline: none;
      white-space: pre;
      overflow-x: auto;
      min-height: 32px;
    }
    .inline-code-box:focus { border-color: #34d399; }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px;
      background: #faf8f5;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }

    /* Pipeline Pane */
    .ag-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .ag-card h4 { font: 700 13.5px var(--head); margin-bottom: 8px; }
    .ag-step {
      display: flex;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 7px;
      background: #faf9f6;
      border: 1px solid #ebe7de;
      margin-bottom: 6px;
    }
    .ag-step .num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font: 700 11.5px/22px var(--head);
      text-align: center;
      flex: none;
    }
    .ag-step .who { font: 700 12px var(--head); }
    .ag-step .desc { font-size: 12px; color: #44403c; margin-top: 1px; }

    /* Output Terminal */
    #outPane.on { display: flex; flex-direction: column; padding: 0; }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: #fcfbf9;
      font: 700 12.5px var(--head);
    }
    #term {
      flex: 1;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      font: 12.5px/1.6 var(--mono);
      background: #1c1917;
      color: #f5f5f4;
    }
    #term.err { color: #fca5a5; }

    .empty-state {
      color: var(--mute);
      padding: 28px 18px;
      text-align: center;
      font-size: 13px;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 9px;
    }
  </style>
</head>
<body>
  <header id="appHeader">
    <div class="brand">IntelliFix</div>
    <nav class="nav-links">
      <a href="/" class="nav-link active">Studio</a>
      <a href="/suite-report" class="nav-link">Suites</a>
      <a href="/analytics" class="nav-link">Eco Dashboard</a>
    </nav>
  </header>

  <main id="workspace">
    <section id="left">
      <div id="topBar">
        <div id="topBarLeft">
          <button id="menuBtn">☰ Files</button>
          <div id="fname">Select a file</div>
        </div>
        <div id="codeBtns">
          <select id="langSel">
            <option value="auto">Auto</option>
            <option value="python">Python</option>
            <option value="cpp">C++</option>
          </select>
          <button id="runBtn" class="ghost" disabled>Run</button>
          <button id="saveBtn" class="ghost" disabled>Save</button>
        </div>
      </div>

      <div id="menu">
        <button style="width:100%" id="upBtn">Upload .py / .cpp</button>
        <input type="file" id="upIn" accept=".py,.cpp,.cc,.cxx" hidden>
        <div class="menu-filter">
          <button id="fltAll">All</button>
          <button id="fltErr" class="ghost">Errors</button>
          <button id="fltSec" class="ghost">Security</button>
        </div>
        <div id="files"></div>
      </div>

      <div id="code"></div>

      <div id="leftFooter">
        <div id="legend">
          <span><i class="dot" style="background:var(--sec)"></i>Security</span>
          <span><i class="dot" style="background:var(--parser)"></i>Syntax</span>
          <span><i class="dot" style="background:var(--static)"></i>Static</span>
          <span><i class="dot" style="background:var(--runtime)"></i>Runtime</span>
          <span><i class="dot" style="background:var(--ok)"></i>Patched</span>
        </div>
        <button id="scanBtn" disabled>Analyze</button>
      </div>
    </section>

    <section id="right">
      <div id="scoreHeader">
        <div class="grade-box" id="gradeBox">
          <div class="g-big" id="gradeText">Ready</div>
          <div class="g-sub" id="scoreSub">—</div>
        </div>
        <div class="pillars">
          <div class="pillar">
            <div class="pillar-top"><span>Security</span><b id="pSecVal">—/40</b></div>
            <div class="pillar-bar"><i id="pSecBar"></i></div>
            <div class="pillar-desc" id="pSecDesc">Gate</div>
          </div>
          <div class="pillar">
            <div class="pillar-top"><span>Errors</span><b id="pErrVal">—/45</b></div>
            <div class="pillar-bar"><i id="pErrBar"></i></div>
            <div class="pillar-desc" id="pErrDesc">Correctness</div>
          </div>
          <div class="pillar">
            <div class="pillar-top"><span>Efficiency</span><b id="pEffVal">—/15</b></div>
            <div class="pillar-bar"><i id="pEffBar"></i></div>
            <div class="pillar-desc" id="pEffDesc">Runtime</div>
          </div>
        </div>
      </div>

      <div id="tabs">
        <div class="tab-group">
          <button class="tab on" data-t="diag">Diagnostics <span id="nDiag"></span></button>
          <button class="tab" data-t="pipeline">Pipeline</button>
          <button class="tab" data-t="out">Output <span class="pip" id="outPip" hidden></span></button>
        </div>
        <div id="projHint"></div>
      </div>

      <div class="pane on" id="diagPane">
        <div id="secGateBox"></div>
        <div id="diagList">
          <div class="empty-state">Select a file from <strong>☰ Files</strong> and click <strong>Analyze</strong>.</div>
        </div>
      </div>

      <div class="pane" id="pipelinePane">
        <div id="pipelineBody">
          <div class="empty-state">Run <strong>Analyze</strong> to view the pipeline trace.</div>
        </div>
      </div>

      <div class="pane" id="outPane">
        <div class="bar">
          <span id="outLabel">Output</span>
          <button id="outClear" class="ghost">Clear</button>
        </div>
        <pre id="term">Click Run to execute code.</pre>
      </div>
    </section>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const A = '/api';
    const COL = {
      parser: 'var(--parser)',
      static: 'var(--static)',
      runtime: 'var(--runtime)',
      compiler: 'var(--compiler)',
      sec: 'var(--sec)',
    };
    const GRADE_COL = { A: '#15803d', B: '#1b4332', C: '#b45309', D: '#c2410c', F: '#991b1b' };

    let S = {
      file: null,
      lang: 'auto',
      code: '',
      fixed: '',
      issues: [],
      sec: [],
      secSolution: null,
      scoreData: null,
      blocked: false,
      patchedLines: new Set(),
      allFiles: [],
      menuFilter: 'all',
    };

    const activeLang = () => S.lang === 'auto' ? null : S.lang;
    $('#langSel').onchange = e => { S.lang = e.target.value; };

    function el(t, c, x) {
      const e = document.createElement(t);
      if (c) e.className = c;
      if (x != null) e.textContent = x;
      return e;
    }

    async function j(u, o) {
      const r = await fetch(A + u, o);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || r.status);
      return d;
    }
    const post = (u, b) => j(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });

    /* ---------- Tabs ---------- */
    const PANES = { diag: 'diagPane', pipeline: 'pipelinePane', out: 'outPane' };
    function showTab(t) {
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
      Object.entries(PANES).forEach(([k, id]) => $('#' + id).classList.toggle('on', k === t));
      if (t === 'out') $('#outPip').hidden = true;
    }
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.t));

    /* ---------- File Menu ---------- */
    async function loadFiles() {
      const d = await j('/files');
      S.allFiles = d.files || [];
      renderFileMenu();
    }

    function setMenuFilter(flt) {
      S.menuFilter = flt;
      $('#fltAll').className = flt === 'all' ? '' : 'ghost';
      $('#fltErr').className = flt === 'err' ? '' : 'ghost';
      $('#fltSec').className = flt === 'sec' ? '' : 'ghost';
      renderFileMenu();
    }
    $('#fltAll').onclick = () => setMenuFilter('all');
    $('#fltErr').onclick = () => setMenuFilter('err');
    $('#fltSec').onclick = () => setMenuFilter('sec');

    function renderFileMenu() {
      const box = $('#files');
      box.innerHTML = '';
      const list = S.allFiles.filter(f => {
        if (S.menuFilter === 'err') return !f.is_security;
        if (S.menuFilter === 'sec') return f.is_security;
        return true;
      });
      const groups = [
        ['Error Files', 'var(--accent)', list.filter(f => f.suite_group === 'standard_error')],
        ['Error Benchmarks (2k+)', 'var(--accent)', list.filter(f => f.suite_group === 'large_error')],
        ['Security Files', 'var(--sec)', list.filter(f => f.suite_group === 'standard_security')],
        ['Security Benchmarks (2k+)', 'var(--sec)', list.filter(f => f.suite_group === 'large_security')],
      ];
      groups.forEach(([title, color, arr]) => {
        if (!arr.length) return;
        const h = el('h4', '', `${title} (${arr.length})`);
        h.style.color = color;
        box.append(h);
        arr.forEach(f => {
          const item = el('div', 'fi' + (f.filename === S.file ? ' on' : ''));
          const left = el('span', '', f.filename.replace('benchmarks/', ''));
          left.style.overflow = 'hidden'; left.style.textOverflow = 'ellipsis';
          const right = el('span');
          right.style.display = 'flex'; right.style.gap = '3px'; right.style.flex = 'none';
          right.append(el('span', 'tag ' + (f.language === 'cpp' ? 'cpp' : ''), f.language === 'cpp' ? 'C++' : 'PY'));
          item.append(left, right);
          item.onclick = () => pickFile(f.filename);
          box.append(item);
        });
      });
    }

    async function pickFile(filename) {
      $('#menu').classList.remove('open');
      const d = await j('/source?filename=' + encodeURIComponent(filename));
      S.file = filename;
      S.lang = /\.(cpp|cc|cxx)$/i.test(filename) ? 'cpp' : 'python';
      $('#langSel').value = S.lang;
      S.code = (d.code || '').replace(/\r\n/g, '\n');
      S.fixed = '';
      S.issues = [];
      S.sec = [];
      S.secSolution = null;
      S.blocked = false;
      S.patchedLines.clear();

      $('#fname').textContent = filename.replace('benchmarks/', '');
      $('#fname').title = filename;
      $('#scanBtn').disabled = false;
      $('#scanBtn').textContent = 'Analyze';
      $('#runBtn').disabled = false;
      $('#saveBtn').disabled = false;

      resetScoreHeader();
      $('#secGateBox').innerHTML = '';
      $('#diagList').innerHTML = `<div class="empty-state">Loaded <strong>${filename}</strong>. Click <strong>Analyze</strong>.</div>`;
      paintCode();
    }

    function resetScoreHeader() {
      $('#gradeBox').style.background = 'var(--mute)';
      $('#gradeText').textContent = 'Ready';
      $('#scoreSub').textContent = '—';
      $('#pSecVal').textContent = '—/40'; $('#pSecBar').style.width = '0%'; $('#pSecDesc').textContent = 'Gate';
      $('#pErrVal').textContent = '—/45'; $('#pErrBar').style.width = '0%'; $('#pErrDesc').textContent = 'Correctness';
      $('#pEffVal').textContent = '—/15'; $('#pEffBar').style.width = '0%'; $('#pEffDesc').textContent = 'Runtime';
      $('#projHint').textContent = '';
      $('#nDiag').textContent = '';
    }

    /* ---------- Code Panel with Inline Edit & Insert-Line-Above Anywhere ---------- */
    function paintCode() {
      const box = $('#code');
      box.innerHTML = '';
      const lines = S.code.split('\n');

      const secMap = new Map();
      S.sec.forEach(s => { if (!secMap.has(s.line)) secMap.set(s.line, s); });

      const issByLine = new Map();
      S.issues.forEach(i => {
        if (!i.line) return;
        if (!issByLine.has(i.line)) issByLine.set(i.line, []);
        issByLine.get(i.line).push(i);
      });

      lines.forEach((text, idx) => {
        const lineNo = idx + 1;
        const row = el('div', 'ln');
        row.dataset.line = lineNo;

        const num = el('span', 'ln-num', String(lineNo));
        const codeSpan = el('span', 'ln-txt', text || ' ');
        const actions = el('span', 'ln-actions');

        const lineIssues = issByLine.get(lineNo) || [];
        const lineSec = secMap.get(lineNo);

        if (S.patchedLines.has(lineNo)) {
          row.classList.add('patched-line');
          const b = el('span', 'badge', 'Patched');
          b.style.background = 'var(--ok)';
          actions.append(b);
        } else if (S.blocked && lineSec) {
          row.classList.add('sec', 'hit');
          const b = el('span', 'badge', lineSec.metric_id || 'SEC');
          b.style.background = 'var(--sec)';
          actions.append(b);
        } else if (lineIssues.length) {
          const first = lineIssues[0];
          row.classList.add(first.stage, 'hit');
          const b = el('span', 'badge', first.type);
          b.style.background = COL[first.stage] || 'var(--runtime)';
          actions.append(b);
          row.onclick = () => {
            if (codeSpan.isContentEditable) return;
            focusDiagnosticCard(first.id, lineNo);
          };
        } else if (lineSec) {
          row.classList.add('sec');
          const b = el('span', 'badge', lineSec.severity);
          b.style.background = 'var(--warn)';
          actions.append(b);
        }

        // + Button: Insert a new line right ABOVE this line (matching indentation!)
        const insBtn = el('button', 'ln-btn', '+');
        insBtn.title = `Insert new line above line ${lineNo}`;
        insBtn.onclick = ev => {
          ev.stopPropagation();
          insertLineAt(lineNo);
        };

        // Edit Button: Edit this line inline
        const editBtn = el('button', 'ln-btn', '✎');
        editBtn.title = `Edit line ${lineNo}`;
        editBtn.onclick = ev => {
          ev.stopPropagation();
          startInlineLineEdit(lineNo, codeSpan, editBtn);
        };
        codeSpan.ondblclick = ev => {
          ev.stopPropagation();
          startInlineLineEdit(lineNo, codeSpan, editBtn);
        };

        actions.append(insBtn, editBtn);
        row.append(num, codeSpan, actions);
        box.append(row);
      });

      // Subtle "+ Add line" at end of file
      if (S.file || S.code) {
        const endBtn = el('div', 'add-end-row', '+ Add line at end');
        endBtn.onclick = () => insertLineAt(lines.length + 1);
        box.append(endBtn);
      }
    }

    function shiftLineReferences(insertedAtLine) {
      const nextPatched = new Set();
      S.patchedLines.forEach(ln => nextPatched.add(ln >= insertedAtLine ? ln + 1 : ln));
      nextPatched.add(insertedAtLine);
      S.patchedLines = nextPatched;
      S.issues.forEach(iss => {
        if (iss.line && iss.line >= insertedAtLine) iss.line += 1;
      });
      S.sec.forEach(s => {
        if (s.line && s.line >= insertedAtLine) s.line += 1;
      });
    }

    function insertLineAt(lineNo, initialText = null) {
      const lines = S.code.split('\n');
      const idx = Math.max(0, Math.min(lineNo - 1, lines.length));
      // Inherit indentation from the target line (or previous line if appending at end)
      const refLine = lines[idx] ?? lines[idx - 1] ?? '';
      const indent = (refLine.match(/^\s*/) || [''])[0];
      const textToInsert = initialText !== null
        ? (/^\s+/.test(initialText) ? initialText : indent + initialText)
        : indent;
      lines.splice(idx, 0, textToInsert);
      S.code = lines.join('\n');
      shiftLineReferences(idx + 1);
      $('#scanBtn').textContent = 'Re-analyze';
      paintCode();

      const targetNo = idx + 1;
      jumpToLine(targetNo);
      if (initialText === null) {
        const row = document.querySelector(`.ln[data-line="${targetNo}"]`);
        if (row) {
          const sp = row.querySelector('.ln-txt');
          const btns = row.querySelectorAll('.ln-btn');
          const editBtn = btns[btns.length - 1];
          if (sp && editBtn) startInlineLineEdit(targetNo, sp, editBtn);
        }
      }
    }

    function startInlineLineEdit(lineNo, codeSpan, btn) {
      if (codeSpan.isContentEditable) {
        commitInlineLineEdit(lineNo, codeSpan.textContent);
        return;
      }
      const origLines = S.code.split('\n');
      codeSpan.textContent = origLines[lineNo - 1] ?? '';
      codeSpan.contentEditable = 'true';
      codeSpan.spellcheck = false;
      codeSpan.classList.add('editing-inline');
      btn.textContent = '✓';
      btn.style.background = 'var(--ok)';
      btn.style.color = '#fff';
      codeSpan.focus();

      // Move caret to end of line
      const range = document.createRange();
      range.selectNodeContents(codeSpan);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      codeSpan.onkeydown = e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          commitInlineLineEdit(lineNo, codeSpan.textContent);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          paintCode();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          document.execCommand('insertText', false, '    ');
        }
      };
    }

    function commitInlineLineEdit(lineNo, newText) {
      const lines = S.code.split('\n');
      if (lineNo < 1 || lineNo > lines.length) return;
      lines[lineNo - 1] = newText.replace(/\r?\n/g, '');
      S.code = lines.join('\n');
      S.patchedLines.add(lineNo);
      $('#scanBtn').textContent = 'Re-analyze';
      paintCode();
      jumpToLine(lineNo);
    }

    function jumpToLine(lineNo) {
      if (!lineNo) return;
      const row = document.querySelector(`.ln[data-line="${lineNo}"]`);
      if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        document.querySelectorAll('.ln.active').forEach(x => x.classList.remove('active'));
        row.classList.add('active');
      }
    }

    function focusDiagnosticCard(issueId, lineNo) {
      showTab('diag');
      jumpToLine(lineNo);
      document.querySelectorAll('.diag-card').forEach(c => {
        c.classList.toggle('active', Number(c.dataset.id) === issueId);
      });
      const card = document.querySelector(`.diag-card[data-id="${issueId}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* ---------- Analyze Pipeline ---------- */
    async function runCompilerPipeline() {
      if (!S.code || !S.code.trim()) return;
      const btn = $('#scanBtn');
      btn.disabled = true;
      btn.textContent = 'Analyzing...';

      try {
        const res = await post('/analyze', { filename: S.file, code: S.code, language: activeLang() });
        if (res.language && S.lang === 'auto') {
          S.lang = res.language;
          $('#langSel').value = res.language;
        }
        S.blocked = Boolean(res.blocked);
        S.sec = res.security || [];
        S.secSolution = res.security_solution || null;
        S.issues = res.issues || [];
        S.scoreData = res.score_data || null;
        S.fixed = (!S.blocked && res.fixed_code && res.fixed_code !== S.code) ? res.fixed_code : '';

        renderScoreHeader(S.scoreData);
        renderDiagnosticsPane(res);
        renderPipelinePane(res);
        paintCode();

        if (res.status === 'success' && res.message) {
          setOutput('Output', res.message, false);
        }

        showTab('diag');
        btn.textContent = 'Re-analyze';
      } catch (e) {
        $('#diagList').innerHTML = `<div class="empty-state" style="color:var(--runtime)">${e.message}</div>`;
        btn.textContent = 'Analyze';
      } finally {
        btn.disabled = false;
      }
    }
    $('#scanBtn').onclick = runCompilerPipeline;

    /* ---------- Compact 3-Pillar Score Header ---------- */
    function renderScoreHeader(sc) {
      if (!sc) { resetScoreHeader(); return; }
      $('#gradeBox').style.background = GRADE_COL[sc.grade] || 'var(--mute)';
      $('#gradeText').textContent = `${sc.grade} · ${sc.total_score}`;
      $('#scoreSub').textContent = sc.blocked ? 'Blocked' : (sc.errors.count === 0 ? 'Clean' : `${sc.errors.count} errors`);

      const pSec = sc.security || { score: 0, max: 40 };
      $('#pSecVal').textContent = `${pSec.score}/${pSec.max}`;
      $('#pSecBar').style.width = `${Math.round((pSec.score / pSec.max) * 100)}%`;
      $('#pSecBar').style.background = sc.blocked ? 'var(--sec)' : (pSec.score === 40 ? 'var(--ok)' : 'var(--warn)');
      $('#pSecDesc').textContent = sc.blocked ? 'Blocked' : (S.sec.length ? `${S.sec.length} note(s)` : 'Passed');

      const pErr = sc.errors || { score: 0, max: 45, count: 0 };
      $('#pErrVal').textContent = sc.blocked ? '—' : `${pErr.score}/${pErr.max}`;
      $('#pErrBar').style.width = sc.blocked ? '0%' : `${Math.round((pErr.score / pErr.max) * 100)}%`;
      $('#pErrBar').style.background = pErr.score === 45 ? 'var(--ok)' : (pErr.score >= 25 ? 'var(--warn)' : 'var(--runtime)');
      $('#pErrDesc').textContent = sc.blocked ? 'Halted' : (pErr.count === 0 ? '0 errors' : `${pErr.count} found`);

      const pEff = sc.efficiency || { score: 0, max: 15, evaluated: false };
      $('#pEffVal').textContent = pEff.evaluated ? `${pEff.score}/${pEff.max}` : '—/15';
      $('#pEffBar').style.width = pEff.evaluated ? `${Math.round((pEff.score / pEff.max) * 100)}%` : '0%';
      $('#pEffBar').style.background = pEff.evaluated ? 'var(--ok)' : '#9ca3af';
      $('#pEffDesc').textContent = pEff.evaluated ? `CC ${pEff.avg_cyclomatic}` : 'Pending run';

      const ph = $('#projHint');
      if (sc.projected && pErr.count > 0) {
        ph.textContent = sc.projected.unfixed_remaining === 0
          ? `After AI fixes: ${sc.projected.score}/100 (${sc.projected.grade})`
          : `After AI fixes: ${sc.projected.score}/100 (${sc.projected.unfixed_remaining} manual)`;
      } else {
        ph.textContent = '';
      }
    }

    /* ---------- Diagnostics Pane ---------- */
    function renderDiagnosticsPane(res) {
      const secBox = $('#secGateBox');
      const diagBox = $('#diagList');
      secBox.innerHTML = '';
      diagBox.innerHTML = '';

      if (S.blocked) {
        $('#nDiag').textContent = `(Blocked)`;
        const card = el('div', 'sec-gate-card');
        const h = el('h3');
        h.append(el('span', '', 'Security Gate — Diagnosis Halted'), el('span', 'fix-pill ambig', `${S.sec.length} threat(s)`));
        card.append(h);
        card.append(el('p', '', 'Resolve the critical/high security issue below to proceed with error diagnosis, or stop here.'));

        const codeLines = S.code.split('\n');
        const sol = S.secSolution || {};
        const lineFixes = sol.line_fixes || {};

        S.sec.forEach(v => {
          const row = el('div', 'sec-finding-row');
          const head = el('div', 'sec-finding-head');
          const lnPill = el('button', 'line-jump-pill', `L${v.line}`);
          lnPill.onclick = () => jumpToLine(v.line);
          const sevChip = el('span', 'type-chip', `${v.metric_id || 'SEC'} · ${v.severity}`);
          sevChip.style.background = 'var(--sec)';
          head.append(lnPill, sevChip, el('strong', '', v.type));
          row.append(head);

          const msgP = el('div', '', v.message);
          msgP.style.fontSize = '12.5px'; msgP.style.marginBottom = '7px';
          row.append(msgP);

          const origText = (codeLines[v.line - 1] || '').trim();
          const suggested = lineFixes[v.line] || `# [SANITIZED] ${origText}`;
          const edRow = el('div', 'inline-code-editor-row');
          edRow.append(el('div', 'inline-code-gutter', `L${v.line}`));
          const codeBox = el('div', 'inline-code-box', suggested);
          codeBox.contentEditable = 'true';
          codeBox.spellcheck = false;
          const btn = el('button', '', 'Sanitize');
          btn.onclick = () => { applyLineReplacement(v.line, codeBox.textContent); runCompilerPipeline(); };
          edRow.append(codeBox, btn);
          row.append(edRow);
          card.append(row);
        });

        if (sol.hardened_code) {
          const act = el('div', 'sec-gate-actions');
          const sanAll = el('button', '', 'Sanitize All & Continue');
          sanAll.onclick = () => { S.code = sol.hardened_code; paintCode(); runCompilerPipeline(); };
          act.append(sanAll);
          card.append(act);
        }
        secBox.append(card);
        return;
      }

      if (S.sec.length) {
        const nb = el('div', 'sec-note-banner');
        nb.append(el('strong', '', `Security notes (${S.sec.length}): `));
        S.sec.forEach(s => {
          const d = el('span', '', `L${s.line} ${s.type}  `);
          d.style.cursor = 'pointer'; d.style.textDecoration = 'underline';
          d.onclick = () => jumpToLine(s.line);
          nb.append(d);
        });
        secBox.append(nb);
      }

      const nTotal = S.issues.length;
      const nFixable = S.issues.filter(i => i.patched).length;
      $('#nDiag').textContent = nTotal ? `(${nTotal})` : '';

      if (nTotal === 0) {
        diagBox.innerHTML = `<div class="empty-state" style="border-color:#bbf7d0;background:#f0fdf4;color:#166534;"><strong>Clean</strong> — 0 errors found.</div>`;
        return;
      }

      const tbar = el('div', 'diag-toolbar');
      tbar.append(el('h2', '', `${nTotal} Error${nTotal === 1 ? '' : 's'} (${nFixable} Auto-fix, ${nTotal - nFixable} Manual)`));
      if (S.fixed) {
        const appAll = el('button', '', `Apply ${nFixable} AI Fix${nFixable === 1 ? '' : 'es'}`);
        appAll.onclick = applyAllAiFixes;
        tbar.append(appAll);
      }
      diagBox.append(tbar);

      S.issues.forEach(iss => diagBox.append(buildDiagnosticCard(iss)));
    }

    function buildDiagnosticCard(iss) {
      const card = el('div', 'diag-card' + (iss._applied ? ' is-patched' : ''));
      card.dataset.id = iss.id;
      card.style.setProperty('--c', COL[iss.stage] || 'var(--runtime)');

      const head = el('div', 'diag-head');
      const left = el('div', 'diag-head-left');
      const lnPill = el('button', 'line-jump-pill', `Line ${iss.line ?? '?'}`);
      lnPill.onclick = ev => { ev.stopPropagation(); jumpToLine(iss.line); };
      left.append(lnPill, el('span', 'type-chip', iss.type));

      const statusPill = el(
        'span',
        'fix-pill' + (iss._applied ? ' applied' : (iss.patched ? '' : ' ambig')),
        iss._applied ? 'Patched' : (iss.patched ? 'Auto-fix' : 'Manual')
      );
      head.append(left, statusPill);
      card.append(head);

      const dl = el('dl', 'trio-grid');
      [
        ['Mistake', iss.mistake || iss.meaning],
        ['Why', iss.reason || ''],
        ['Fix', iss.how_to_fix || ''],
      ].forEach(([k, v]) => {
        if (v) dl.append(el('dt', '', k), el('dd', '', v));
      });
      card.append(dl);

      const pbox = el('div', 'patch-box');
      pbox.append(el('div', 'diff-line minus', `- ${iss.source || ''}`));

      const plusPatches = (iss.patch || []).filter(p => p.sign === '+');
      const aiText = plusPatches.length ? plusPatches.map(p => p.text).join('\n') : '';
      if (iss.patched && aiText) {
        pbox.append(el('div', 'diff-line plus', `+ ${aiText}`));
      }

      // Inline Manual Code Box (Supports editing this line OR inserting a new line above!)
      const manualWrap = el('div', 'manual-patch-wrap');
      manualWrap.hidden = Boolean(iss.patched);

      const edRow = el('div', 'inline-code-editor-row');
      edRow.append(el('div', 'inline-code-gutter', `L${iss.line || 1}`));
      const codeBox = el('div', 'inline-code-box', aiText || iss.source || '');
      codeBox.contentEditable = 'true';
      codeBox.spellcheck = false;

      const applyManBtn = el('button', iss.patched ? 'ghost' : 'amber', 'Apply');
      const commitManual = () => {
        applyLineReplacement(iss.line || 1, codeBox.textContent);
        iss._applied = true;
        statusPill.textContent = 'Patched';
        statusPill.className = 'fix-pill applied';
        card.classList.add('is-patched');
      };
      applyManBtn.onclick = ev => { ev.stopPropagation(); commitManual(); };
      codeBox.onkeydown = e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitManual(); }
        else if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
      };

      edRow.append(codeBox, applyManBtn);
      manualWrap.append(edRow);
      pbox.append(manualWrap);

      const actBar = el('div', 'card-actions');
      const leftBtns = el('div');
      leftBtns.style.display = 'flex'; leftBtns.style.gap = '6px';

      if (iss.patched && aiText) {
        const aiBtn = el('button', '', iss._applied ? 'Applied' : 'Apply AI Fix');
        aiBtn.disabled = Boolean(iss._applied);
        aiBtn.onclick = ev => {
          ev.stopPropagation();
          applySingleIssuePatch(iss);
          aiBtn.textContent = 'Applied';
          aiBtn.disabled = true;
          statusPill.textContent = 'Patched';
          statusPill.className = 'fix-pill applied';
          card.classList.add('is-patched');
        };
        const editTog = el('button', 'ghost', 'Edit');
        editTog.onclick = ev => {
          ev.stopPropagation();
          manualWrap.hidden = !manualWrap.hidden;
          if (!manualWrap.hidden) codeBox.focus();
        };
        leftBtns.append(aiBtn, editTog);
      }

      // Insert a new line right above this error line (e.g., to assign a missing variable)
      const insAboveBtn = el('button', 'ghost', `+ Line above L${iss.line}`);
      insAboveBtn.onclick = ev => {
        ev.stopPropagation();
        insertLineAt(iss.line || 1);
      };
      leftBtns.append(insAboveBtn);

      actBar.append(leftBtns);
      pbox.append(actBar);
      card.append(pbox);

      card.onclick = () => jumpToLine(iss.line);
      return card;
    }

    function applyLineReplacement(lineNo, newText) {
      const lines = S.code.split('\n');
      const idx = (lineNo || 1) - 1;
      if (idx < 0 || idx >= lines.length) return;
      const origIndent = (lines[idx].match(/^\s*/) || [''])[0];
      const parts = newText.replace(/\r\n/g, '\n').split('\n').map(p => (/^\s+/.test(p) ? p : origIndent + p.trim()));
      lines.splice(idx, 1, ...parts);
      S.code = lines.join('\n');
      S.patchedLines.add(lineNo);
      if (parts.length > 1) {
        const extra = parts.length - 1;
        S.issues.forEach(o => { if (o.line && o.line > lineNo) o.line += extra; });
      }
      $('#scanBtn').textContent = 'Re-analyze';
      paintCode();
      jumpToLine(lineNo);
    }

    function applySingleIssuePatch(iss) {
      if (iss._applied) return;
      const plusPatches = (iss.patch || []).filter(p => p.sign === '+');
      const hasMinus = (iss.patch || []).some(p => p.sign === '-');
      if (!plusPatches.length) return;

      const lines = S.code.split('\n');
      let targetLine = iss.line || 1;
      if (hasMinus) {
        const idx = targetLine - 1;
        if (idx < 0 || idx >= lines.length) return;
        const indent = (lines[idx].match(/^\s*/) || [''])[0];
        const rep = plusPatches.map(p => indent + p.text.trim());
        lines.splice(idx, 1, ...rep);
      } else {
        const pText = plusPatches[0].text.trim();
        const insertIdx = /^(#include\b|import\s+|from\s+)/.test(pText) ? 0 : Math.max(0, targetLine - 1);
        const refIndent = insertIdx > 0 ? ((lines[insertIdx].match(/^\s*/) || [''])[0]) : '';
        lines.splice(insertIdx, 0, refIndent + pText);
        targetLine = insertIdx + 1;
        S.issues.forEach(o => { if (o !== iss && o.line && o.line >= targetLine) o.line += 1; });
      }
      S.code = lines.join('\n');
      iss._applied = true;
      S.patchedLines.add(targetLine);
      $('#scanBtn').textContent = 'Re-analyze';
      paintCode();
      jumpToLine(targetLine);
    }

    async function applyAllAiFixes() {
      if (!S.fixed) return;
      S.code = S.fixed;
      S.issues.forEach(i => { if (i.patched && i.line) S.patchedLines.add(i.line); });
      paintCode();
      await runCompilerPipeline();
    }

    /* ---------- Pipeline Pane ---------- */
    function renderPipelinePane(res) {
      const box = $('#pipelineBody');
      box.innerHTML = '';
      const sc = res.score_data || {};
      const c1 = el('div', 'ag-card');
      c1.append(el('h4', '', `Score Breakdown (${sc.grade_label || '—'})`));
      [
        ['Security', `${sc.security?.score ?? 0}/40`, sc.security?.status || ''],
        ['Errors', `${sc.errors?.score ?? 0}/45`, sc.errors?.status || ''],
        ['Efficiency', `${sc.efficiency?.score ?? 0}/15`, sc.efficiency?.status || ''],
      ].forEach(([t, v, d], i) => {
        const st = el('div', 'ag-step');
        st.append(el('div', 'num', String(i + 1)));
        const b = el('div');
        b.append(el('div', 'who', `${t} · ${v}`), el('div', 'desc', d));
        st.append(b);
        c1.append(st);
      });
      box.append(c1);

      const c2 = el('div', 'ag-card');
      c2.append(el('h4', '', '5-Agent Pipeline'));
      [
        ['Perception & IR', `Parsed ${S.code.split('\n').length} lines (${res.language || 'python'}).`],
        ['Security Auditor', S.blocked ? `Blocked: ${S.sec.length} threat(s).` : `Passed (${S.sec.length} note(s)).`],
        ['Static & Runtime Analyzer', S.blocked ? 'Skipped at Stage 1.' : `Found ${S.issues.length} error(s).`],
        ['AI Synthesizer', S.blocked ? 'Generated security patch.' : `${S.issues.filter(i => i.patched).length} auto-fix, ${S.issues.filter(i => !i.patched).length} manual.`],
        ['Verifier', (res.summary || {}).verdict || 'DONE'],
      ].forEach(([w, d], i) => {
        const st = el('div', 'ag-step');
        st.append(el('div', 'num', String(i + 1)));
        const b = el('div');
        b.append(el('div', 'who', w), el('div', 'desc', d));
        st.append(b);
        c2.append(st);
      });
      box.append(c2);
    }

    /* ---------- Run / Save / Menu / Upload ---------- */
    function setOutput(label, text, isErr) {
      $('#outLabel').textContent = label;
      $('#term').textContent = text;
      $('#term').classList.toggle('err', Boolean(isErr));
      if (!$('#outPane').classList.contains('on')) $('#outPip').hidden = false;
    }
    $('#outClear').onclick = () => setOutput('Output', '', false);

    $('#runBtn').onclick = async () => {
      showTab('out');
      setOutput('Running...', 'Executing...');
      try {
        const d = await post('/execute', { code: S.code, filename: S.file, language: activeLang() });
        const out = d.output || '';
        setOutput(S.file || 'Output', out, /CRASH|ERROR|BLOCKED|failure/i.test(out));
      } catch (e) { setOutput('Error', e.message, true); }
    };

    $('#saveBtn').onclick = async () => {
      if (!S.file) return;
      try {
        const d = await post('/save', { filename: S.file, code: S.code, language: activeLang() });
        const old = $('#saveBtn').textContent;
        $('#saveBtn').textContent = 'Saved';
        setTimeout(() => { $('#saveBtn').textContent = old; }, 1600);
        await loadFiles();
      } catch (e) { alert(e.message); }
    };

    $('#menuBtn').onclick = () => { $('#menu').classList.toggle('open'); loadFiles(); };
    $('#upBtn').onclick = () => $('#upIn').click();
    $('#upIn').onchange = async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const d = await post('/upload', { filename: f.name, code: await f.text() });
        await loadFiles();
        await pickFile(d.filename);
      } catch (err) { alert(err.message); }
      e.target.value = '';
    };

    window.addEventListener('DOMContentLoaded', async () => {
      await loadFiles();
      const targetFile = new URLSearchParams(window.location.search).get('file');
      if (targetFile) {
        await pickFile(targetFile);
        await runCompilerPipeline();
      }
    });
  </script>
</body>
</html>
