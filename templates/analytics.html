<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Analytics - Compiler Error Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@500;600;700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { color-scheme: light; --bg:#f6f4ef; --panel:#ffffff; --panel2:#efece6; --border:#dcd7cd; --text:#1c1917; --muted:#6b665e; --accent:#1b4332; --accent-hover:#143326; --accent-soft:#e6f0ec; --warn:#b45309; --head:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; --body:'Work Sans',-apple-system,BlinkMacSystemFont,sans-serif; --mono:'IBM Plex Mono',monospace; }
        * { box-sizing: border-box; }
        body { font: 14px/1.55 var(--body); background: var(--bg); color: var(--text); padding: 32px 40px 48px; margin: 0; }
        h1, h2, h3, h4, .back-link, .btn, .badge, th { font-family: var(--head); }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 20px; }
        .header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 0; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
        .back-link:hover { text-decoration: underline; }
        .meta { color: var(--muted); font-size: 13.5px; margin-bottom: 24px; line-height: 1.55; }
        .btn { padding: 9px 18px; border-radius: 6px; border: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap; transition: background-color .18s ease, transform .14s ease, opacity .18s ease; }
        .btn:hover:not(:disabled) { background: var(--accent-hover); }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:focus-visible, .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .btn:disabled { opacity: .5; cursor: wait; }
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; box-shadow: 0 4px 12px rgba(28, 25, 23, 0.06); animation: cardIn .32s cubic-bezier(0.16,1,0.3,1) both; }
        .chart-card h3 { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; color: var(--text); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
        .src { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); line-height: 1.45; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; padding: 3px 9px; border-radius: 5px; background: #fef9ec; color: #92400e; border: 1px solid #f3dfb0; white-space: nowrap; }
        .badge.real { background: var(--accent-soft); color: var(--accent); border-color: #c6dfd4; }
        .note { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
        table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: #fcfbf9; }
        td { font-family: var(--mono); font-size: 12px; }
        .empty { background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; padding: 30px; color: var(--muted); text-align: center; }
        .nm { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (max-width: 560px) { body { padding: 20px 14px; } .chart-grid { grid-template-columns: 1fr; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <a href="/" class="back-link">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Studio
            </a>
            <h1>Eco-Metrics Dashboard</h1>
        </div>
        <button class="btn" id="btn-refresh">Re-run benchmark</button>
    </div>
    <div class="meta" id="meta">Loading measurements...</div>

    <div id="content"></div>

    <script>
        Chart.defaults.color = '#6b665e';
        Chart.defaults.borderColor = '#e6e1d7';
        Chart.defaults.font.family = "'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif";
        const charts = {};
        const COLORS = {
            detect: '#1b4332', repair: '#b45309', verify: '#6d28d9',
            CRITICAL: '#7f1d1d', HIGH: '#b91c1c', MEDIUM: '#b45309', LOW: '#d9c7a3'
        };
        const VERDICT_COLORS = {
            'VERIFIED': '#1b4332',
            'PARTIAL': '#b45309',
            'REJECTED': '#b91c1c',
            'NO FIX GENERATED': '#6b665e'
        };

        function el(tag, props = {}, children = []) {
            const n = document.createElement(tag);
            Object.entries(props).forEach(([k, v]) => {
                if (k === 'text') n.textContent = v;
                else n.setAttribute(k, v);
            });
            children.forEach(c => n.appendChild(c));
            return n;
        }

        // A card = title (+ badge), a "Source:" line stating where the numbers come from, and a body.
        function card(id, title, source, estimate, extraBody) {
            const h3 = el('h3', {}, [
                el('span', { text: title }),
                el('span', { class: estimate ? 'badge' : 'badge real', text: estimate ? 'ESTIMATE' : 'MEASURED' })
            ]);
            const body = extraBody || el('div', { class: 'chart-container' }, [el('canvas', { id })]);
            return el('div', { class: 'chart-card' }, [h3, el('p', { class: 'src', text: 'Source: ' + source }), body]);
        }

        function chart(id, config) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id).getContext('2d'), config);
        }

        const baseOpts = (yTitle, stacked) => ({
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: stacked },
                tooltip: {
                    backgroundColor: '#1c1917',
                    titleColor: '#f6f4ef',
                    bodyColor: '#efece6',
                    borderColor: '#dcd7cd',
                    borderWidth: 1,
                    padding: 12,
                    borderRadius: 8
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    stacked: !!stacked,
                    title: { display: !!yTitle, text: yTitle },
                    grid: { color: '#ebe7de' }
                },
                x: {
                    stacked: !!stacked,
                    grid: { display: false },
                    ticks: {
                        maxRotation: 60,
                        minRotation: 30,
                        autoSkip: false,
                        font: { family: "'IBM Plex Mono', monospace", size: 10 }
                    }
                }
            }
        });

        function render(d) {
            const content = document.getElementById('content');
            content.innerHTML = '';
            const m = d.meta;

            document.getElementById('meta').textContent = !d.has_benchmark
                ? 'No benchmark data yet.'
                : `${m.files} test files run through the real pipeline (median of repeated runs, last run ${m.generated}). ` +
                  `Energy estimates use ${m.power_w} W` +
                  (m.power_is_default ? ' (DEFAULT value: powermetrics_log.txt not found)'
                                      : ` = mean of ${m.power_samples} powermetrics samples on ${m.machine}`) + '.';

            if (!d.has_benchmark) {
                content.appendChild(el('div', { class: 'empty', text: 'Press "Re-run benchmark" to measure the pipeline on the test files.' }));
                return;
            }

            const grid = el('div', { class: 'chart-grid' });
            content.appendChild(grid);

            // 1. time per file, split by pipeline stage
            grid.appendChild(card('c-time', 'Pipeline time per file (ms)',
                'fix_benchmark.py, perf_counter around detect / repair loop / verify. Files ordered by size.', false));
            // 2. static vs runtime detection
            grid.appendChild(card('c-stage', 'Detection latency: parser vs static vs runtime (ms)',
                'Median detection time. Parser and static stages never start a subprocess; runtime detection does.', false));
            // 3. outcomes
            grid.appendChild(card('c-outcome', 'Auto-fix outcome (verify_fix verdicts)',
                'Each patch is re-analysed, security-scanned and re-run in the sandbox.', false));
            // 4. patches
            grid.appendChild(card('c-patches', 'Repair passes per file',
                'Number of patches the repair loop applied before the code was clean.', false));
            // 5. energy
            grid.appendChild(card('c-energy', 'Energy per file (mJ)',
                `Mean package power (${m.power_w} W, powermetrics) x measured time. Not metered during the run.`, true));
            // 6. power samples
            if (d.power.watts.length) {
                grid.appendChild(card('c-power', 'Package power samples (W)',
                    `powermetrics_log.txt on ${m.machine}: Intel energy-model package power, one value per ~100 ms sample.`, false));
            }
            // 7. CodeCarbon table
            const tbl = el('table');
            tbl.appendChild(el('tr', {}, ['Timestamp', 'Duration (s)', 'CO2eq (mg)', 'Energy (mWh)', 'CPU power (W)']
                .map(t => el('th', { text: t }))));
            d.codecarbon.forEach(r => tbl.appendChild(el('tr', {}, [r.timestamp, r.duration_s, r.emissions_mg, r.energy_mwh, r.cpu_power_w]
                .map(t => el('td', { text: String(t) })))));
            const ccBody = el('div', {}, d.codecarbon.length
                ? [tbl, el('p', {
                    class: 'note',
                    text: 'CodeCarbon ran in "' + d.codecarbon[0].tracking_mode + '" mode: its CPU power is a constant model value, ' +
                          'not a reading, so it does not match the powermetrics samples. Durations of about 5 s match the sandbox timeout, ' +
                          'so these rows look like runs of test9.py (an infinite loop).'
                })]
                : [el('p', { class: 'note', text: 'No emissions.csv found. Run the app with USE_CODECARBON=1 to create it.' })]);
            grid.appendChild(card('c-cc', 'CodeCarbon runs', 'emissions.csv, rows written by CodeCarbon itself.', false, ccBody));
            // 8. security
            const skipped = d.security.skipped.length
                ? el('p', { class: 'note', text: 'Not scanned (file does not parse, so there is no AST): ' + d.security.skipped.join(', ') })
                : null;
            const secBody = el('div', {}, [el('div', { class: 'chart-container' }, [el('canvas', { id: 'c-sec' })])]);
            if (skipped) secBody.appendChild(skipped);
            grid.appendChild(card('c-sec-card', 'Security findings per test file',
                'SecurityAnalyzer run live on every test*.py when this page loads.', false, secBody));
            // 9. not measured
            grid.appendChild(card('c-nm', 'Not measured', 'Listed so nothing is implied that was not recorded.', false,
                el('div', { class: 'nm' }, d.not_measured.map(t => el('div', { text: t })))));

            // ---- draw charts ----
            chart('c-time', {
                type: 'bar',
                data: {
                    labels: d.latency.labels,
                    datasets: [
                        { label: 'Detect', data: d.latency.detect, backgroundColor: COLORS.detect },
                        { label: 'Repair loop', data: d.latency.repair, backgroundColor: COLORS.repair },
                        { label: 'Verify', data: d.latency.verify, backgroundColor: COLORS.verify }
                    ]
                },
                options: baseOpts('ms', true)
            });

            chart('c-stage', {
                type: 'bar',
                data: {
                    labels: ['Parser (' + d.stage.parser.n + ' files)', 'Static (' + d.stage.static.n + ' files)', 'Runtime (' + d.stage.runtime.n + ' files)'],
                    datasets: [{
                        data: [d.stage.parser.median_ms, d.stage.static.median_ms, d.stage.runtime.median_ms],
                        backgroundColor: ['#6d28d966', '#b4530966', '#b91c1c66'],
                        borderColor: ['#6d28d9', '#b45309', '#b91c1c'],
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: baseOpts('ms (median)', false)
            });

            const vk = Object.keys(d.outcomes.verdicts);
            chart('c-outcome', {
                type: 'doughnut',
                data: {
                    labels: vk.map(k => k + ' (' + d.outcomes.verdicts[k] + ')'),
                    datasets: [{
                        data: vk.map(k => d.outcomes.verdicts[k]),
                        backgroundColor: vk.map(k => VERDICT_COLORS[k] || '#6b665e')
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Correct error detected: ' + d.outcomes.detected_ok + ' / ' + d.outcomes.total }
                    }
                }
            });

            chart('c-patches', {
                type: 'bar',
                data: {
                    labels: d.patches.labels,
                    datasets: [{
                        data: d.patches.values,
                        backgroundColor: '#1b433244',
                        borderColor: '#1b4332',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: baseOpts('patches', false)
            });

            chart('c-energy', {
                type: 'bar',
                data: {
                    labels: d.energy.labels,
                    datasets: [{
                        data: d.energy.mJ,
                        backgroundColor: '#b4530944',
                        borderColor: '#b45309',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: baseOpts('mJ (estimate)', false)
            });

            if (d.power.watts.length) {
                chart('c-power', {
                    type: 'line',
                    data: {
                        labels: d.power.labels,
                        datasets: [
                            { label: 'Package power', data: d.power.watts, borderColor: '#1b4332', backgroundColor: '#1b433322', fill: true, tension: .25 },
                            { label: 'Mean (' + d.power.mean_w + ' W)', data: d.power.watts.map(() => d.power.mean_w), borderColor: '#6b665e', borderDash: [6, 4], pointRadius: 0 }
                        ]
                    },
                    options: { ...baseOpts('W', false), plugins: { legend: { display: true } } }
                });
            }

            chart('c-sec', {
                type: 'bar',
                data: {
                    labels: d.security.labels,
                    datasets: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].map(s => ({ label: s, data: d.security[s], backgroundColor: COLORS[s] }))
                },
                options: baseOpts('findings', true)
            });
        }

        async function load(url, opts) {
            const res = await fetch(url, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            render(data);
        }

        document.getElementById('btn-refresh').onclick = async (e) => {
            const b = e.target;
            b.disabled = true;
            b.textContent = 'Running benchmark...';
            try {
                await load('/api/analytics/refresh', { method: 'POST' });
            } catch (err) {
                document.getElementById('meta').textContent = 'Benchmark failed: ' + err.message;
            }
            b.disabled = false;
            b.textContent = 'Re-run benchmark';
        };

        load('/api/analytics').catch(err => {
            document.getElementById('meta').textContent = 'Could not load analytics: ' + err.message;
        });
    </script>
</body>
</html>
