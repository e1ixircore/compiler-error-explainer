<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Analytics - Compiler Error Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { color-scheme:dark; --bg:#0d1117; --panel:#151a23; --panel2:#1d2430; --border:#2b3442; --accent:#5b8cff; --text:#e6eaf2; --muted:#8d98aa; }
        body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--text); padding:40px; margin:0; }
        .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:20px; }
        .header h1 { font-size:1.8rem; font-weight:700; margin:6px 0 0; }
        .back-link { color:var(--accent); text-decoration:none; font-weight:600; display:flex; align-items:center; gap:8px; }
        .meta { color:var(--muted); font-size:0.88rem; margin-bottom:26px; line-height:1.5; }
        .btn { padding:10px 20px; border-radius:8px; border:none; font-weight:600; cursor:pointer; background:#4a7bf0; color:#fff; white-space:nowrap; }
        .btn:disabled { opacity:.6; cursor:wait; }
        .chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(450px,1fr)); gap:25px; }
        .chart-card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:25px; box-shadow:0 4px 14px rgba(0,0,0,.45); }
        .chart-card h3 { font-size:1.05rem; margin:0 0 6px; color:var(--text); font-weight:600; display:flex; justify-content:space-between; gap:10px; align-items:center; }
        .src { font-size:.78rem; color:var(--muted); margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--border); line-height:1.4; }
        .chart-container { position:relative; height:300px; width:100%; }
        .badge { font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:999px; background:#3a2a14; color:#f0c27a; white-space:nowrap; }
        .badge.real { background:#12301f; color:#8de0b5; }
        .note { font-size:.82rem; color:var(--muted); margin-top:12px; line-height:1.5; }
        table { width:100%; border-collapse:collapse; font-size:.85rem; }
        th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
        th { color:var(--muted); font-weight:600; }
        .empty { background:var(--panel); border:1px dashed var(--border); border-radius:12px; padding:30px; color:var(--muted); }
        .nm { background:var(--panel2); border-radius:10px; padding:14px 16px; font-size:.88rem; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <a href="/" class="back-link">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Studio
            </a>
            <h1>Eco-Metrics Dashboard</h1>
        </div>
        <button class="btn" id="btn-refresh">Re-run benchmark</button>
    </div>
    <div class="meta" id="meta">Loading measurements...</div>

    <div id="content"></div>

    <script>
        Chart.defaults.color = '#8d98aa';
        Chart.defaults.borderColor = '#2b3442';
        Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
        const charts = {};
        const COLORS = { detect:'#2563EB', repair:'#10B981', verify:'#F59E0B',
                         CRITICAL:'#B91C1C', HIGH:'#EF4444', MEDIUM:'#F59E0B', LOW:'#93C5FD' };
        const VERDICT_COLORS = { 'VERIFIED':'#10B981', 'PARTIAL':'#F59E0B', 'REJECTED':'#EF4444', 'NO FIX GENERATED':'#9CA3AF' };

        function el(tag, props = {}, children = []) {
            const n = document.createElement(tag);
            Object.entries(props).forEach(([k, v]) => { if (k === 'text') n.textContent = v; else n.setAttribute(k, v); });
            children.forEach(c => n.appendChild(c));
            return n;
        }

        // A card = title (+ badge), a "Source:" line stating where the numbers come from, and a body.
        function card(id, title, source, estimate, extraBody) {
            const h3 = el('h3', {}, [el('span', { text: title }),
                el('span', { class: estimate ? 'badge' : 'badge real', text: estimate ? 'ESTIMATE' : 'MEASURED' })]);
            const body = extraBody || el('div', { class: 'chart-container' }, [el('canvas', { id })]);
            return el('div', { class: 'chart-card' }, [h3, el('p', { class: 'src', text: 'Source: ' + source }), body]);
        }

        function chart(id, config) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id).getContext('2d'), config);
        }

        const baseOpts = (yTitle, stacked) => ({
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: stacked }, tooltip: { backgroundColor: '#0d1117', borderColor: '#2b3442', borderWidth: 1, padding: 12, borderRadius: 8 } },
            scales: { y: { beginAtZero: true, stacked: !!stacked, title: { display: !!yTitle, text: yTitle }, grid: { color: '#2b3442' } },
                      x: { stacked: !!stacked, grid: { display: false }, ticks: { maxRotation: 60, minRotation: 30, autoSkip: false, font: { size: 10 } } } }
        });

        function render(d) {
            const content = document.getElementById('content');
            content.innerHTML = '';
            const m = d.meta;

            document.getElementById('meta').textContent = !d.has_benchmark
                ? 'No benchmark data yet.'
                : `${m.files} test files run through the real pipeline (median of repeated runs, last run ${m.generated}). ` +
                  `Energy estimates use ${m.power_w} W` +
                  (m.power_is_default ? ' (DEFAULT value: powermetrics_log.txt not found)'
                                      : ` = mean of ${m.power_samples} powermetrics samples on ${m.machine}`) + '.';

            if (!d.has_benchmark) {
                content.appendChild(el('div', { class: 'empty', text: 'Press "Re-run benchmark" to measure the pipeline on the test files.' }));
                return;
            }

            const grid = el('div', { class: 'chart-grid' });
            content.appendChild(grid);

            // 1. time per file, split by pipeline stage
            grid.appendChild(card('c-time', 'Pipeline time per file (ms)',
                'fix_benchmark.py, perf_counter around detect / repair loop / verify. Files ordered by size.', false));
            // 2. static vs runtime detection
            grid.appendChild(card('c-stage', 'Detection latency: static vs runtime (ms)',
                'Median detection time. Static analysis never starts a subprocess; runtime detection does.', false));
            // 3. outcomes
            grid.appendChild(card('c-outcome', 'Auto-fix outcome (verify_fix verdicts)',
                'Each patch is re-analysed, security-scanned and re-run in the sandbox.', false));
            // 4. patches
            grid.appendChild(card('c-patches', 'Repair passes per file',
                'Number of patches the repair loop applied before the code was clean.', false));
            // 5. energy
            grid.appendChild(card('c-energy', 'Energy per file (mJ)',
                `Mean package power (${m.power_w} W, powermetrics) x measured time. Not metered during the run.`, true));
            // 6. power samples
            if (d.power.watts.length) {
                grid.appendChild(card('c-power', 'Package power samples (W)',
                    `powermetrics_log.txt on ${m.machine}: Intel energy-model package power, one value per ~100 ms sample.`, false));
            }
            // 7. CodeCarbon table
            const tbl = el('table');
            tbl.appendChild(el('tr', {}, ['Timestamp', 'Duration (s)', 'CO2eq (mg)', 'Energy (mWh)', 'CPU power (W)']
                .map(t => el('th', { text: t }))));
            d.codecarbon.forEach(r => tbl.appendChild(el('tr', {}, [r.timestamp, r.duration_s, r.emissions_mg, r.energy_mwh, r.cpu_power_w]
                .map(t => el('td', { text: String(t) })))));
            const ccBody = el('div', {}, d.codecarbon.length ? [tbl, el('p', { class: 'note',
                text: 'CodeCarbon ran in "' + d.codecarbon[0].tracking_mode + '" mode: its CPU power is a constant model value, ' +
                      'not a reading, so it does not match the powermetrics samples. Durations of about 5 s match the sandbox timeout, ' +
                      'so these rows look like runs of test9.py (an infinite loop).' })]
                : [el('p', { class: 'note', text: 'No emissions.csv found. Run the app with USE_CODECARBON=1 to create it.' })]);
            grid.appendChild(card('c-cc', 'CodeCarbon runs', 'emissions.csv, rows written by CodeCarbon itself.', false, ccBody));
            // 8. security
            const skipped = d.security.skipped.length
                ? el('p', { class: 'note', text: 'Not scanned (file does not parse, so there is no AST): ' + d.security.skipped.join(', ') })
                : null;
            const secBody = el('div', {}, [el('div', { class: 'chart-container' }, [el('canvas', { id: 'c-sec' })])]);
            if (skipped) secBody.appendChild(skipped);
            grid.appendChild(card('c-sec-card', 'Security findings per test file',
                'SecurityAnalyzer run live on every test*.py when this page loads.', false, secBody));
            // 9. not measured
            grid.appendChild(card('c-nm', 'Not measured', 'Listed so nothing is implied that was not recorded.', false,
                el('div', { class: 'nm' }, d.not_measured.map(t => el('div', { text: t })))));

            // ---- draw charts ----
            chart('c-time', { type: 'bar', data: { labels: d.latency.labels, datasets: [
                { label: 'Detect', data: d.latency.detect, backgroundColor: COLORS.detect },
                { label: 'Repair loop', data: d.latency.repair, backgroundColor: COLORS.repair },
                { label: 'Verify', data: d.latency.verify, backgroundColor: COLORS.verify } ] },
                options: baseOpts('ms', true) });

            chart('c-stage', { type: 'bar', data: { labels: ['Static (' + d.stage.static.n + ' files)', 'Runtime (' + d.stage.runtime.n + ' files)'],
                datasets: [{ data: [d.stage.static.median_ms, d.stage.runtime.median_ms],
                             backgroundColor: ['#10B98166', '#2563EB66'], borderColor: ['#10B981', '#2563EB'], borderWidth: 2, borderRadius: 8 }] },
                options: baseOpts('ms (median)', false) });

            const vk = Object.keys(d.outcomes.verdicts);
            chart('c-outcome', { type: 'doughnut', data: { labels: vk.map(k => k + ' (' + d.outcomes.verdicts[k] + ')'),
                datasets: [{ data: vk.map(k => d.outcomes.verdicts[k]), backgroundColor: vk.map(k => VERDICT_COLORS[k] || '#6B7280') }] },
                options: { responsive: true, maintainAspectRatio: false,
                           plugins: { title: { display: true, text: 'Correct error detected: ' + d.outcomes.detected_ok + ' / ' + d.outcomes.total } } } });

            chart('c-patches', { type: 'bar', data: { labels: d.patches.labels, datasets: [{ data: d.patches.values,
                backgroundColor: '#8B5CF644', borderColor: '#8B5CF6', borderWidth: 2, borderRadius: 8 }] },
                options: baseOpts('patches', false) });

            chart('c-energy', { type: 'bar', data: { labels: d.energy.labels, datasets: [{ data: d.energy.mJ,
                backgroundColor: '#F59E0B44', borderColor: '#F59E0B', borderWidth: 2, borderRadius: 8 }] },
                options: baseOpts('mJ (estimate)', false) });

            if (d.power.watts.length) {
                chart('c-power', { type: 'line', data: { labels: d.power.labels, datasets: [
                    { label: 'Package power', data: d.power.watts, borderColor: '#EC4899', backgroundColor: '#EC489922', fill: true, tension: .25 },
                    { label: 'Mean (' + d.power.mean_w + ' W)', data: d.power.watts.map(() => d.power.mean_w), borderColor: '#6B7280', borderDash: [6, 4], pointRadius: 0 } ] },
                    options: { ...baseOpts('W', false), plugins: { legend: { display: true } } } });
            }

            chart('c-sec', { type: 'bar', data: { labels: d.security.labels,
                datasets: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].map(s => ({ label: s, data: d.security[s], backgroundColor: COLORS[s] })) },
                options: baseOpts('findings', true) });
        }

        async function load(url, opts) {
            const res = await fetch(url, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            render(data);
        }

        document.getElementById('btn-refresh').onclick = async (e) => {
            const b = e.target; b.disabled = true; b.textContent = 'Running benchmark...';
            try { await load('/api/analytics/refresh', { method: 'POST' }); }
            catch (err) { document.getElementById('meta').textContent = 'Benchmark failed: ' + err.message; }
            b.disabled = false; b.textContent = 'Re-run benchmark';
        };

        load('/api/analytics').catch(err => { document.getElementById('meta').textContent = 'Could not load analytics: ' + err.message; });
    </script>
</body>
</html>
